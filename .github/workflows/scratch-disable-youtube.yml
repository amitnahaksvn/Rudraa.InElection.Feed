name: Scratch - disable YouTube RSS provider (temporary)
on:
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Get current RSS providers, find YouTube's schedule
        run: |
          curl -sS --max-time 20 "https://rudraa-webapp-azhebqbfhrfkfwc8.centralindia-01.azurewebsites.net/api/providers/rss" \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for p in data:
              if p.get('name') == 'YouTube':
                  print(json.dumps(p, indent=2))
          "
