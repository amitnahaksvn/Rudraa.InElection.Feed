name: Diagnostic - ErrorLogs breakdown via HTTP (temporary)
on:
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Counts
        run: curl -sS --max-time 20 "https://rudraa-webapp-azhebqbfhrfkfwc8.centralindia-01.azurewebsites.net/api/errors/counts" | python3 -m json.tool

      - name: Provider/category breakdown
        run: curl -sS --max-time 20 "https://rudraa-webapp-azhebqbfhrfkfwc8.centralindia-01.azurewebsites.net/api/errors/breakdown" | python3 -m json.tool

      - name: News18 newest 5 (post-fix check)
        run: curl -sS --max-time 20 "https://rudraa-webapp-azhebqbfhrfkfwc8.centralindia-01.azurewebsites.net/api/errors?page=1&pageSize=5&isResolved=false&provider=News18" | python3 -m json.tool

      - name: Organiser newest 5 (post-fix check)
        run: curl -sS --max-time 20 "https://rudraa-webapp-azhebqbfhrfkfwc8.centralindia-01.azurewebsites.net/api/errors?page=1&pageSize=5&isResolved=false&provider=Organiser" | python3 -m json.tool

      - name: NationalHerald newest 5 (post-fix check)
        run: curl -sS --max-time 20 "https://rudraa-webapp-azhebqbfhrfkfwc8.centralindia-01.azurewebsites.net/api/errors?page=1&pageSize=5&isResolved=false&provider=NationalHerald" | python3 -m json.tool

      - name: IndiaToday newest 5 (post-fix check)
        run: curl -sS --max-time 20 "https://rudraa-webapp-azhebqbfhrfkfwc8.centralindia-01.azurewebsites.net/api/errors?page=1&pageSize=5&isResolved=false&provider=IndiaToday" | python3 -m json.tool

      - name: MinistryOfPortsShipping newest 5 (post-fix check)
        run: curl -sS --max-time 20 "https://rudraa-webapp-azhebqbfhrfkfwc8.centralindia-01.azurewebsites.net/api/errors?page=1&pageSize=5&isResolved=false&provider=MinistryOfPortsShipping" | python3 -m json.tool

      - name: NavhindTimes newest 5 (still unaddressed - need error content)
        run: curl -sS --max-time 20 "https://rudraa-webapp-azhebqbfhrfkfwc8.centralindia-01.azurewebsites.net/api/errors?page=1&pageSize=5&isResolved=false&provider=NavhindTimes" | python3 -m json.tool

      - name: YouTube newest 5 (still unaddressed - need error content)
        run: curl -sS --max-time 20 "https://rudraa-webapp-azhebqbfhrfkfwc8.centralindia-01.azurewebsites.net/api/errors?page=1&pageSize=5&isResolved=false&provider=YouTube" | python3 -m json.tool

      - name: YouTube newest 3 unresolved - ids only
        id: youtube_ids
        run: |
          curl -sS --max-time 20 "https://rudraa-webapp-azhebqbfhrfkfwc8.centralindia-01.azurewebsites.net/api/errors?page=1&pageSize=3&isResolved=false&provider=YouTube" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('\n'.join(i['id'] for i in d['items']))" > ids.txt
          cat ids.txt

      - name: YouTube full error detail (BJP + Modi samples)
        run: |
          while read -r id; do
            echo "=== $id ==="
            curl -sS --max-time 20 "https://rudraa-webapp-azhebqbfhrfkfwc8.centralindia-01.azurewebsites.net/api/errors/$id" | python3 -m json.tool
          done < ids.txt

      - name: Test YouTube feed URLs directly from GitHub Actions (not Azure)
        run: |
          echo "--- Modi channel feed ---"
          curl -s -o modi.xml -w "HTTP=%{http_code} bytes=%{size_download}\n" --max-time 20 "https://www.youtube.com/feeds/videos.xml?channel_id=UC1NF71EwP41VdjAU1iXdLkw"
          head -c 500 modi.xml; echo
          echo "--- BJP channel feed ---"
          curl -s -o bjp.xml -w "HTTP=%{http_code} bytes=%{size_download}\n" --max-time 20 "https://www.youtube.com/feeds/videos.xml?channel_id=UCrwE8kVqtIUVUzKui2WVpuQ"
          head -c 500 bjp.xml; echo
          echo "--- Same Modi request with a browser User-Agent ---"
          curl -s -o modi_ua.xml -w "HTTP=%{http_code} bytes=%{size_download}\n" --max-time 20 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" "https://www.youtube.com/feeds/videos.xml?channel_id=UC1NF71EwP41VdjAU1iXdLkw"
          head -c 500 modi_ua.xml; echo
