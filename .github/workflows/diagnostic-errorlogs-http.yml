name: Diagnostic - ErrorLogs breakdown via HTTP (temporary)
on:
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Replicate WaybackMachineFeedResolver's EXACT CDX query for Organiser
        run: |
          curl -sS --max-time 20 "https://web.archive.org/cdx/search/cdx?url=https%3A%2F%2Forganiser.org%2Ffeed&output=json&limit=-5&filter=statuscode:200"
          echo

      - name: Replicate WaybackMachineFeedResolver's EXACT CDX query for IndiaToday
        run: |
          curl -sS --max-time 45 "https://web.archive.org/cdx/search/cdx?url=https%3A%2F%2Fwww.indiatoday.in%2Frss%2F1206578&output=json&limit=-5&filter=statuscode:200"
          echo

      - name: Fetch the resolved archive.org snapshot URL for Organiser (proof the mechanism works end to end)
        run: |
          snapshot=$(curl -sS --max-time 20 "https://web.archive.org/cdx/search/cdx?url=https%3A%2F%2Forganiser.org%2Ffeed&output=json&limit=-5&filter=statuscode:200" | python3 -c "
          import json, sys
          rows = json.load(sys.stdin)
          if len(rows) >= 2:
              ts, orig = rows[-1][1], rows[-1][2]
              print('https://web.archive.org/web/' + ts + 'id_/' + orig)
          ")
          echo "Resolved snapshot URL: $snapshot"
          if [ -n "$snapshot" ]; then
            curl -sS -o snap.xml -w "HTTP=%{http_code} bytes=%{size_download}\n" --max-time 20 "$snapshot"
            head -c 500 snap.xml; echo
          fi
