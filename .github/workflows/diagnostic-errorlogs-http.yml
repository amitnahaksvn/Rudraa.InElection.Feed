name: Diagnostic - ErrorLogs breakdown via HTTP (temporary)
on:
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Organiser
        run: curl -sS -X POST --max-time 20 -w "\nHTTP=%{http_code}\n" "https://rudraa-webapp-azhebqbfhrfkfwc8.centralindia-01.azurewebsites.net/api/crawl/trigger/Organiser?country=India"

      - name: Trigger IndiaToday
        run: curl -sS -X POST --max-time 20 -w "\nHTTP=%{http_code}\n" "https://rudraa-webapp-azhebqbfhrfkfwc8.centralindia-01.azurewebsites.net/api/crawl/trigger/IndiaToday?country=India"

      - name: Trigger MinistryOfPortsShipping
        run: curl -sS -X POST --max-time 20 -w "\nHTTP=%{http_code}\n" "https://rudraa-webapp-azhebqbfhrfkfwc8.centralindia-01.azurewebsites.net/api/crawl/trigger/MinistryOfPortsShipping?country=India"

      - name: Wait for the crawls to run
        run: sleep 40

      - name: Organiser newest unresolved errors AFTER trigger
        run: curl -sS --max-time 20 "https://rudraa-webapp-azhebqbfhrfkfwc8.centralindia-01.azurewebsites.net/api/errors?page=1&pageSize=5&isResolved=false&provider=Organiser" | python3 -m json.tool

      - name: Organiser latest articles
        run: curl -sS --max-time 20 "https://rudraa-webapp-azhebqbfhrfkfwc8.centralindia-01.azurewebsites.net/api/news/provider/Organiser?count=5" | python3 -m json.tool

      - name: IndiaToday newest unresolved errors AFTER trigger
        run: curl -sS --max-time 20 "https://rudraa-webapp-azhebqbfhrfkfwc8.centralindia-01.azurewebsites.net/api/errors?page=1&pageSize=5&isResolved=false&provider=IndiaToday" | python3 -m json.tool

      - name: IndiaToday latest articles
        run: curl -sS --max-time 20 "https://rudraa-webapp-azhebqbfhrfkfwc8.centralindia-01.azurewebsites.net/api/news/provider/IndiaToday?count=5" | python3 -m json.tool

      - name: MinistryOfPortsShipping newest unresolved errors AFTER trigger
        run: curl -sS --max-time 20 "https://rudraa-webapp-azhebqbfhrfkfwc8.centralindia-01.azurewebsites.net/api/errors?page=1&pageSize=5&isResolved=false&provider=MinistryOfPortsShipping" | python3 -m json.tool

      - name: MinistryOfPortsShipping latest articles
        run: curl -sS --max-time 20 "https://rudraa-webapp-azhebqbfhrfkfwc8.centralindia-01.azurewebsites.net/api/news/provider/MinistryOfPortsShipping?count=5" | python3 -m json.tool
