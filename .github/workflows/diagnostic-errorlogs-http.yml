name: Diagnostic - ErrorLogs breakdown via HTTP (temporary)
on:
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Bulk-delete YouTube pre-fix errors (before PR 25's 20:30:21Z ApiService deploy)
        run: curl -sS -X DELETE --max-time 30 -w "\nHTTP=%{http_code}\n" "https://rudraa-webapp-azhebqbfhrfkfwc8.centralindia-01.azurewebsites.net/api/errors?provider=YouTube&createdBefore=2026-09-13T20%3A30%3A21Z"

      - name: Bulk-delete NationalHerald pre-fix errors (before PR 23's 20:14:17Z deploy)
        run: curl -sS -X DELETE --max-time 30 -w "\nHTTP=%{http_code}\n" "https://rudraa-webapp-azhebqbfhrfkfwc8.centralindia-01.azurewebsites.net/api/errors?provider=NationalHerald&createdBefore=2026-09-13T20%3A14%3A17Z"

      - name: Bulk-delete NavhindTimes stale errors (stopped occurring 2026-09-08, no code fix needed)
        run: curl -sS -X DELETE --max-time 30 -w "\nHTTP=%{http_code}\n" "https://rudraa-webapp-azhebqbfhrfkfwc8.centralindia-01.azurewebsites.net/api/errors?provider=NavhindTimes&createdBefore=2026-09-13T00%3A00%3A00Z"

      - name: Final counts after all cleanup
        run: curl -sS --max-time 20 "https://rudraa-webapp-azhebqbfhrfkfwc8.centralindia-01.azurewebsites.net/api/errors/counts" | python3 -m json.tool

      - name: Final provider/category breakdown
        run: curl -sS --max-time 20 "https://rudraa-webapp-azhebqbfhrfkfwc8.centralindia-01.azurewebsites.net/api/errors/breakdown" | python3 -m json.tool
